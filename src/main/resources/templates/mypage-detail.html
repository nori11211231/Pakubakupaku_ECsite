<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>会員情報 | 北海道EC</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<div class="container">
		<!-- HEADER (既存のヘッダーと同じ) -->
		<header>
			<div class="brand">
				<a th:href="@{/}"><h1>HOKKAIDO.</h1></a>
			</div>
			<form th:action="@{/products}" method="get" class="searchbar">
				<input type="text" name="keyword" placeholder="北海道の商品を探す">
				<button type="submit">検索</button>
			</form>
			<div class="user-area">
				<div class="point-view">
					<span>POINT</span>
					<strong th:text="${user.point}">0</strong>
				</div>
				<a th:href="@{/mypage}" class="btn">マイページ</a>
			</div>
		</header>

		<!-- NAV (既存のメニューと同じ) -->
		<nav class="nav-menu">
			<a th:href="@{/products}">商品一覧</a>
			<a th:href="@{/regions}">地域から探す</a>
			<a th:href="@{/points}">ポイント</a>
			<a th:href="@{/points/history}">ポイント履歴</a>
			<a th:href="@{/game}">ミニゲーム</a>
			<a th:href="@{/game/history}">ゲーム履歴</a>
			<a th:href="@{/orders}">注文履歴</a>
		</nav>

		<!-- MAIN CONTENT: 会員情報表示エリア -->
		<section class="profile-area" style="padding: 40px 20px; background: #fff; margin-top: 20px; border-radius: 8px;">
			<div class="section-title" style="margin-bottom: 30px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px;">
				<h2 style="font-size: 24px; color: #333;">会員情報・プロフィール</h2>
			</div>

			<!-- 情報表示テーブル -->
			<table class="profile-table" style="width: 100%; border-collapse: collapse; font-size: 16px;">
				<tr style="border-bottom: 1px solid #eee;">
					<th style="text-align: left; padding: 15px; width: 200px; background: #f9f9f9; color: #555;">お名前</th>
					<td style="padding: 15px; color: #333;" th:text="${user.name}">山田 太郎</td>
				</tr>
				<tr style="border-bottom: 1px solid #eee;">
					<th style="text-align: left; padding: 15px; background: #f9f9f9; color: #555;">メールアドレス</th>
					<td style="padding: 15px; color: #333;" th:text="${user.email}">sample@example.com</td>
				</tr>
				<tr style="border-bottom: 1px solid #eee;">
					<th style="text-align: left; padding: 15px; background: #f9f9f9; color: #555;">ご住所</th>
					<td style="padding: 15px; color: #333;" th:text="${user.address}">北海道札幌市...</td>
				</tr>
				<tr style="border-bottom: 1px solid #eee;">
					<th style="text-align: left; padding: 15px; background: #f9f9f9; color: #555;">電話番号</th>
					<td style="padding: 15px; color: #333;" th:text="${user.phone}">090-1234-5678</td>
				</tr>
				<tr style="border-bottom: 1px solid #eee;">
					<th style="text-align: left; padding: 15px; background: #f9f9f9; color: #555;">現在の会員ランク</th>
					<td style="padding: 15px; color: #333; font-weight: bold;" th:text="${rankName}">ゴールド会員</td>
				</tr>
				<tr style="border-bottom: 1px solid #eee;">
					<th style="text-align: left; padding: 15px; background: #f9f9f9; color: #555;">所持ポイント</th>
					<td style="padding: 15px; color: #e67e22; font-weight: bold;"><span th:text="${user.point}">0</span> pt</td>
				</tr>
				<tr style="border-bottom: 1px solid #eee;">
					<th style="text-align: left; padding: 15px; background: #f9f9f9; color: #555;">総購入金額</th>
					<td style="padding: 15px; color: #333;" th:text="${user.totalPurchaseAmount != null ? user.totalPurchaseAmount + ' 円' : '0 円'}">0 円</td>
				</tr>
			</table>

			<!-- ボタンエリア -->
			<div style="margin-top: 30px; text-align: center;">
				<a th:href="@{/mypage}" class="btn btn-primary" style="padding: 10px 30px;">マイページトップへ戻る</a>
			</div>
		</section>

		<!-- FOOTER -->
		<footer>
			HOKKAIDO. © 2026
		</footer>
	</div>
</body>
</html>
