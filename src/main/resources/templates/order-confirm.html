<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h2>注文確認</h2>

	<table>
	    <tr>
	        <th>商品名</th>
	        <th>数量</th>
	        <th>価格</th>
	        <th>小計</th>
	        <th>操作</th>
	    </tr>

	    <tr th:each="item : ${cartItems}">
	        <td th:text="${item.productName}"></td>

	        <!-- 数量変更フォーム -->
	        <td style="text-align: center;">
	            <form th:action="@{/order/updateQuantity}" method="post">
	                <input type="hidden" name="productId" th:value="${item.productId}" />
	                <input type="number" name="quantity"
	                       th:value="${item.quantity}"
	                       min="1" max="99"
	                       style="width: 60px;" />
	                <button type="submit">変更</button>
	            </form>
	        </td>

	        <td th:text="${item.price}"></td>
	        <td th:text="${item.itemSubtotal}"></td>

	        <!-- 削除ボタン -->
	        <td>
	            <form th:action="@{/order/remove}" method="post">
	                <input type="hidden" name="productId" th:value="${item.productId}" />
	                <button type="submit">削除</button>
	            </form>
	        </td>
	    </tr>
	</table>


	<p>合計金額：<span th:text="${totalAmount}"></span>円</p>






	
	<form action="/order/complete" method="post">
	    <label>配送先住所：</label>
	    <input type="text" name="shippingAddress" required>

	    <label>使用ポイント：</label>
	    <input type="number" name="usedPoint" min="0" th:max="${userPoint}">

	    <button type="submit">注文確定</button>
	</form>

</body>
</html>
