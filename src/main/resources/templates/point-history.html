<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ポイント履歴 - 北海道EC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <div th:replace="fragments/_header :: header"></div>

    <div class="container my-5" style="max-width: 800px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="h4 text-secondary mb-3">ポイント履歴</h2>
                <p class="text-muted small">これまでのポイントの増減履歴です。</p>

                <div th:if="${#lists.isEmpty(pointHistoryList)}" class="text-center my-5">
                    <p class="text-muted">ポイントの履歴はまだありません。</p>
                </div>

                <table class="table table-hover align-middle mt-4" th:if="${!#lists.isEmpty(pointHistoryList)}">
                    <thead class="table-light">
                        <tr>
                            <th>発生日時</th>
                            <th class="text-end">増減ポイント</th>
                            <th>理由・内容</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="history : ${pointHistoryList}">
                            <td class="text-muted small" th:text="${#temporals.format(history.createdAt, 'yyyy/MM/dd HH:mm')}">2026/05/18 12:00</td>
                            <td class="text-end fw-bold">
                                <span th:if="${history.pointChange > 0}" class="text-success" th:text="${'+' + history.pointChange}">+100</span>
                                <span th:if="${history.pointChange <= 0}" class="text-danger" th:text="${history.pointChange}">-50</span>
                            </td>
                            <td th:text="${history.reason}">購入</td>
                        </tr>
                    </tbody>
                </table>

                <div class="mt-4 text-center">
                    <a th:href="@{/points}" class="btn btn-outline-secondary btn-sm">ポイントページに戻る</a>
                </div>
            </div>
        </div>
    </div>

<div th:replace="fragments/_footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
