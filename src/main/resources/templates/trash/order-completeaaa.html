<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<title>注文完了 | 北海道EC</title>

	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="stylesheet" th:href="@{/css/style_merged.css}">

	<link rel="preconnect" href="https://fonts.googleapis.com">

	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<link
		href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+JP:wght@300;400;500;700&display=swap"
		rel="stylesheet">

</head>

<body>
	<div th:replace="~{fragments/_header :: header}"></div>

	<div class="container">

		<!-- COMPLETE CARD -->

		<section class="complete-wrapper">

			<div class="complete-card">

				<!-- ICON -->

				<div class="complete-icon">

					✓

				</div>

				<!-- TITLE -->

				<div class="complete-sub">

					ORDER COMPLETE

				</div>

				<h1>

					ご注文ありがとうございます

				</h1>

				<!-- MESSAGE -->

				<p class="complete-message">

					ご注文が正常に完了しました。<br>
					北海道の商品を発送準備しております。

				</p>

				<!-- BUTTONS -->

				<div class="complete-buttons">

					<a href="/order/history" class="btn btn-primary">

						注文履歴を見る

					</a>

					<a href="/top" class="btn">

						トップへ戻る

					</a>

				</div>

			</div>

		</section>

	</div>

</body>

</html>
