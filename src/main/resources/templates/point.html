<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ポイント・AI・ミニゲーム - 北海道EC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container my-5">
        <div class="text-center mb-4">
            <h1 class="h3 text-secondary">ポイント・AI・ミニゲーム</h1>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                
                <div class="card shadow-sm mb-4 border-0">
                    <div class="card-body bg-white rounded">
                        <h5 class="card-title text-muted text-sm mb-2">所有ポイント</h5>
                        <div class="d-flex align-items-baseline">
                            <span class="h1 text-primary fw-bold" th:text="${#numbers.formatInteger(user.point, 1, 'COMMA')}">1,250</span>
                            <span class="ms-2 text-secondary fw-bold">pt</span>
                        </div>
                        <p class="text-muted text-xs mt-2 mb-0">現在利用可能なポイントです。</p>
                    </div>
                </div>

                <div class="card shadow-sm mb-4 border-0">
                    <div class="card-body">
                        <h5 class="card-title fw-bold mb-3">ポイントの使い道</h5>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item bg-transparent px-0 py-2">🛒 買い物で利用する（1ポイント＝1円）</li>
                            <li class="list-group-item bg-transparent px-0 py-2">🎰 ミニゲーム（スロット）に挑戦して増やす</li>
                        </ul>
                        <div class="mt-3">
                            <a th:href="@{/slot}" class="btn btn-outline-primary btn-sm">ミニゲームへ進む</a>
                            <a th:href="@{/points/history}" class="btn btn-outline-secondary btn-sm ms-2">ポイント履歴を見る</a>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title fw-bold mb-4">ポイントを貯めるミッション</h5>
                        
                        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                        <div class="vstack gap-3">
                            
                            <div class="d-flex align-items-center justify-content-between p-3 bg-light rounded">
                                <div class="d-flex align-items-center">
                                    <span class="fs-3 me-3">💰</span>
                                    <div>
                                        <h6 class="mb-0 fw-bold">広告を見る</h6>
                                        <small class="text-muted">動画やバナーを確認してポイントをGET</small>
                                    </div>
                                </div>
                                <form th:action="@{/points/mission/ad}" method="post" class="m-0">
                                    <button type="submit" class="btn btn-primary px-4 btn-sm">GET</button>
                                </form>
                            </div>

                            <div class="d-flex align-items-center justify-content-between p-3 bg-light rounded">
                                <div class="d-flex align-items-center">
                                    <span class="fs-3 me-3">💰</span>
                                    <div>
                                        <h6 class="mb-0 fw-bold">Xで共有する</h6>
                                        <small class="text-muted">北海道ECのおすすめ情報をポストする</small>
                                    </div>
                                </div>
                                <form th:action="@{/points/mission/share}" method="post" class="m-0">
                                    <button type="submit" class="btn btn-warning text-white px-4 btn-sm">挑戦</button>
                                </form>
                            </div>

                            <div class="d-flex align-items-center justify-content-between p-3 bg-light rounded">
                                <div class="d-flex align-items-center">
                                    <span class="fs-3 me-3">💰</span>
                                    <div>
                                        <h6 class="mb-0 fw-bold">地域サイトを確認</h6>
                                        <small class="text-muted">北海道各地域の特設観光情報サイトをチェック</small>
                                    </div>
                                </div>
                                <form th:action="@{/points/mission/region}" method="post" class="m-0">
                                    <button type="submit" class="btn btn-warning text-white px-4 btn-sm">挑戦</button>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>

            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm border-0 mb-4 text-center">
                    <div class="card-body">
                        <h5 class="card-title fw-bold mb-3">AI育成状況</h5>
                        
                        <div class="my-3">
                            <span class="badge bg-info text-dark fs-6" th:text="'Lv.' + ${aiGrowth.level}">Lv.3</span>
                            <div class="text-muted small mt-2" th:text="'現在の経験値: ' + ${aiGrowth.exp} + ' pt'">現在の経験値: 7,800 pt</div>
                        </div>
                        
                        <hr>
                        
                        <p class="text-secondary small font-monospace mb-0">
                            あと <span class="text-danger fw-bold" th:text="${nextLevelRequiredAmount}">2,200</span> 円購入でレベルアップ！
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/ai-widget :: ai-widget}"></div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
