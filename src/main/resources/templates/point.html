<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>ポイントページ - 北海道EC</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

	<div th:replace="~{fragments/_header :: header}"></div>

	<main class="container my-5">

		<h2 class="mb-4">ポイントページ</h2>

		<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
		<div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

		<div class="row g-4">

			<div class="col-md-6">
				<div class="card">
					<div class="card-header">
						所有ポイント
					</div>
					<div class="card-body">
						<p class="fs-3 fw-bold mb-3">
							<span th:text="${#numbers.formatInteger(user.point, 1, 'COMMA')}">0</span> pt
						</p>

						<p class="mb-1">ポイントの使い道</p>
						<ul>
							<li>買い物で利用</li>
							<li>ミニゲームで利用</li>
						</ul>

						<a th:href="@{/game}" class="btn btn-primary">
							ミニゲームへ
						</a>
					</div>
				</div>
			</div>

			<div class="col-md-6">
				<div class="card">
					<div class="card-header">
						ミッション
					</div>

					<div class="card-body">

						<div class="d-flex justify-content-between align-items-center border-bottom py-3">
							<div>
								<p class="mb-0 fw-bold">広告を見る</p>
								<small class="text-muted">10ポイント獲得</small>
							</div>

							<form th:action="@{/points/mission/ad}" method="post">
								<button type="submit" class="btn btn-outline-primary btn-sm">
									GET
								</button>
							</form>
						</div>

						<div class="d-flex justify-content-between align-items-center border-bottom py-3">
							<div>
								<p class="mb-0 fw-bold">Xで共有する</p>
								<small class="text-muted">20ポイント獲得</small>
							</div>

							<form th:action="@{/points/mission/share}" method="post">
								<button type="submit" class="btn btn-outline-primary btn-sm">
									挑戦
								</button>
							</form>
						</div>

					</div>
				</div>
			</div>

		</div>

		<div class="card mt-4">
			<div class="card-header d-flex justify-content-between align-items-center">
				<span>最近のポイント履歴</span>
				<a th:href="@{/points/history}" class="btn btn-sm btn-outline-secondary">
					履歴をすべて見る
				</a>
			</div>

			<div class="card-body">

				<div th:if="${#lists.isEmpty(pointHistoryList)}">
					<p class="text-muted mb-0">ポイント履歴はまだありません。</p>
				</div>

				<table th:if="${!#lists.isEmpty(pointHistoryList)}" class="table table-bordered table-striped">
					<thead>
						<tr>
							<th>日時</th>
							<th>内容</th>
							<th>ポイント</th>
						</tr>
					</thead>

					<tbody>
						<tr th:each="history : ${pointHistoryList}">
							<td th:text="${#temporals.format(history.createdAt, 'yyyy/MM/dd HH:mm')}">
								2026/05/19 12:00
							</td>
							<td th:text="${history.reason}">
								広告視聴
							</td>
							<td>
								<span th:text="${history.pointChange}">10</span> pt
							</td>
						</tr>
					</tbody>
				</table>

			</div>
		</div>

	</main>

	<div th:replace="~{fragments/_footer :: footer}"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
