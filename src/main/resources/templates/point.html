<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>ポイントページ - 北海道EC</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

	<div th:replace="~{fragments/_header :: header}"></div>

	<main class="container my-5">

		<h2 class="mb-4">ポイントページ</h2>

		<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
		<div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

		<div class="row g-4">

			<div class="col-md-6">
				<div class="card">
					<div class="card-header">
						所有ポイント
					</div>
					<div class="card-body">
						<p class="fs-3 fw-bold mb-3">
							<span th:text="${#numbers.formatInteger(user.point, 1, 'COMMA')}">0</span> pt
						</p>

						<p class="mb-1">ポイントの使い道</p>
						<ul>
							<li>買い物で利用</li>
							<li>ミニゲームで利用</li>
						</ul>

						<a th:href="@{/game}" class="btn btn-primary">
							ミニゲームへ
						</a>
					</div>
				</div>
			</div>

			<div class="col-md-6">
				<div class="card">
					<div class="card-header">
						ミッション
					</div>

					<div class="card-body">

						<!-- ★変更：広告ミッションボタンの判定化 -->
						<div class="d-flex justify-content-between align-items-center border-bottom py-3">
							<div>
								<p class="mb-0 fw-bold">広告を見る</p>
								<small class="text-muted">10ポイント獲得</small>
							</div>

							<form th:action="@{/points/mission/ad}" method="post">
								<button type="submit" class="btn btn-sm" 
										th:classappend="${isAdCleared} ? 'btn-secondary' : 'btn-outline-primary'"
										th:disabled="${isAdCleared}"
										th:text="${isAdCleared} ? '挑戦済み' : 'GET'">
									GET
								</button>
							</form>
						</div>

						<!-- ★変更：X共有ミッションボタンの判定化 -->
						<div class="d-flex justify-content-between align-items-center border-bottom py-3">
							<div>
								<p class="mb-0 fw-bold">Xで共有する</p>
								<small class="text-muted">20ポイント獲得</small>
							</div>

							<form th:action="@{/points/mission/share}" method="post">
								<button type="submit" class="btn btn-sm" 
										th:classappend="${isShareCleared} ? 'btn-secondary' : 'btn-outline-primary'"
										th:disabled="${isShareCleared}"
										th:text="${isShareCleared} ? '挑戦済み' : '挑戦'">
									挑戦
								</button>
							</form>
						</div>

					</div>
				</div>
			</div>

		</div>

		<div class="card mt-4">
			<div class="card-header d-flex justify-content-between align-items-center">
				<span>最近のポイント履歴</span>
				<a th:href="@{/points/history}" class="btn btn-sm btn-outline-secondary">
					履歴をすべて見る
				</a>
			</div>

			<div class="card-body">

				<div th:if="${#lists.isEmpty(pointHistoryList)}">
					<p class="text-muted mb-0">ポイント履歴はまだありません。</p>
				</div>

				<table th:if="${!#lists.isEmpty(pointHistoryList)}" class="table table-bordered table-striped">
					<thead>
						<tr>
							<th>日時</th>
							<th>内容</th>
							<th>ポイント</th>
						</tr>
					</thead>

					<tbody>
						<tr th:each="history : ${pointHistoryList}">
							<td th:text="${#temporals.format(history.createdAt, 'yyyy/MM/dd HH:mm')}">
								2026/05/19 12:00
							</td>
							<td th:text="${history.reason}">
								広告視聴
							</td>
							<td>
								<span th:text="${history.pointChange}">10</span> pt
							</td>
						</tr>
					</tbody>
				</table>

			</div>
		</div>

		<!-- ★追加：ミッション達成直後のリロード時のみ表示される演出用HTML -->
		<div th:if="${showPointEffect}" id="pure-css-overlay">
			<div class="pure-css-text">ポイント獲得！！</div>
		</div>

	</main>

	<!-- ★追加：演出用のCSS（JavaScriptなしで自動消滅させるアニメーション設定） -->
	<style>
	/* 全画面を覆う黒い背景レイヤー */
	#pure-css-overlay {
		position: fixed;
		top: 0; left: 0;
		width: 100vw; height: 100vh;
		background: rgba(0, 0, 0, 0.7);
		display: flex; justify-content: center; align-items: center;
		z-index: 9999;
		/* 3秒かけてアニメーション（再生後は最後の状態を維持） */
		animation: fadeOutOverlay 3.0s forwards;
	}

	/* 中央の大きな「ポイント獲得」の文字 */
	.pure-css-text {
		color: #fffb00;
		font-size: 4rem;
		font-weight: bold;
		text-shadow: 0 0 20px #ff6600;
		/* 文字が飛び出してくるようなアニメーション */
		animation: zoomInText 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
	}

	/* 背景が自動的にフワッと消え、後ろのボタンを触れるようにする設定 */
	@keyframes fadeOutOverlay {
		0% { opacity: 1; pointer-events: auto; }
		80% { opacity: 1; pointer-events: auto; }   /* 2.4秒間はしっかり表示 */
		100% { opacity: 0; pointer-events: none; } /* 残り0.6秒で消滅、クリックも透過 */
	}

	/* 文字のズームアニメーション設定 */
	@keyframes zoomInText {
		0% { transform: scale(0.3); }
		100% { transform: scale(1.0); }
	}
	</style>

	<div th:replace="~{fragments/_footer :: footer}"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
