<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>注文完了 | 北海道EC</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" th:href="@{/css/style_merged.css}">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
	<style>
		.order-page {
			padding-top: 42px;
			padding-bottom: 80px;
		}

		.order-hero {
			text-align: center;
			margin: 36px auto 34px;
		}

		.order-label,
		.complete-sub,
		.hero-label {
			letter-spacing: .18em;
			font-size: 13px;
			font-weight: 700;
			color: #9a6b2f;
			margin-bottom: 12px;
		}

		.order-hero h1,
		.order-hero h2 {
			font-size: clamp(30px, 4vw, 48px);
			margin: 0 0 12px;
		}

		.order-hero p {
			line-height: 1.9;
			color: #6f665c;
			margin: 0;
		}

		.order-card,
		.order-panel,
		.complete-card {
			background: rgba(255, 255, 255, .92);
			border: 1px solid rgba(120, 92, 58, .16);
			border-radius: 28px;
			box-shadow: 0 18px 45px rgba(80, 60, 30, .10);
			padding: clamp(22px, 4vw, 44px);
		}

		.order-card + .order-card,
		.order-panel + .order-panel {
			margin-top: 24px;
		}

		.order-section-title {
			font-size: 22px;
			margin: 0 0 20px;
		}

		.order-table,
		.history-table {
			width: 100%;
			border-collapse: collapse;
			overflow: hidden;
		}

		.order-table th,
		.order-table td,
		.history-table th,
		.history-table td {
			padding: 16px 14px;
			border-bottom: 1px solid rgba(120, 92, 58, .14);
			vertical-align: middle;
		}

		.order-table th,
		.history-table th {
			font-size: 13px;
			letter-spacing: .08em;
			color: #7b5a31;
			background: rgba(180, 132, 58, .08);
			white-space: nowrap;
		}

		.order-table td,
		.history-table td {
			color: #3d352d;
		}

		.price-cell,
		.text-right {
			text-align: right;
			font-weight: 700;
		}

		.text-center {
			text-align: center;
		}

		.order-form-inline {
			display: inline-flex;
			align-items: center;
			gap: 8px;
		}

		.order-input,
		.order-qty-input {
			border: 1px solid rgba(120, 92, 58, .25);
			border-radius: 999px;
			padding: 10px 14px;
			background: #fff;
			font-family: inherit;
		}

		.order-qty-input {
			width: 76px;
			text-align: center;
		}

		.order-form-grid {
			display: grid;
			grid-template-columns: 1.2fr .8fr;
			gap: 18px;
			margin-top: 22px;
		}

		.form-field {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		.form-field label {
			font-weight: 700;
			color: #5e4b35;
		}

		.summary-box {
			margin-top: 26px;
			margin-left: auto;
			max-width: 460px;
			background: rgba(180, 132, 58, .07);
			border-radius: 22px;
			padding: 20px;
		}

		.summary-row,
		.detail-row {
			display: flex;
			justify-content: space-between;
			gap: 18px;
			padding: 10px 0;
			border-bottom: 1px solid rgba(120, 92, 58, .12);
		}

		.summary-row:last-child,
		.detail-row:last-child {
			border-bottom: 0;
		}

		.summary-row strong,
		.detail-row strong {
			color: #5e4b35;
		}

		.total-row {
			font-size: 20px;
			font-weight: 700;
		}

		.order-alert {
			margin: 18px 0;
			padding: 14px 18px;
			border-radius: 16px;
			background: rgba(190, 54, 54, .08);
			color: #b53131;
			font-weight: 700;
		}

		.order-actions,
		.complete-buttons {
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 14px;
			flex-wrap: wrap;
			margin-top: 28px;
		}

		.btn-small {
			padding: 8px 14px;
			font-size: 13px;
		}

		.btn-danger {
			background: #fff;
			color: #b53131;
			border: 1px solid rgba(181, 49, 49, .28);
		}

		.detail-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 12px 28px;
		}

		.order-product-img {
			width: 86px;
			height: 66px;
			object-fit: cover;
			border-radius: 14px;
			box-shadow: 0 8px 18px rgba(80, 60, 30, .12);
		}

		.complete-wrapper {
			max-width: 760px;
			margin: 36px auto;
			text-align: center;
		}

		.complete-icon {
			width: 72px;
			height: 72px;
			border-radius: 50%;
			display: grid;
			place-items: center;
			margin: 0 auto 20px;
			background: rgba(154, 107, 47, .12);
			color: #9a6b2f;
			font-size: 34px;
			font-weight: 700;
		}

		.complete-message {
			line-height: 1.9;
			color: #6f665c;
		}

		.empty-history {
			text-align: center;
			padding: 44px 20px;
		}

		@media (max-width: 760px) {
			.order-form-grid,
			.detail-grid {
				grid-template-columns: 1fr;
			}

			.order-table,
			.history-table {
				display: block;
				overflow-x: auto;
				white-space: nowrap;
			}
		}
	</style>
</head>

<body>
	<div th:replace="~{fragments/_header :: header}"></div>

	<main class="container order-page">
		<section class="complete-wrapper">
			<div class="complete-card">
				<div class="complete-icon">✓</div>
				<div class="complete-sub">ORDER COMPLETE</div>
				<h1>ご注文ありがとうございます</h1>

				<p class="complete-message">
					ご注文が正常に完了しました。<br>
					北海道の商品を発送準備しております。
				</p>

				<div class="summary-box" th:if="${orderId != null or totalAmount != null or usedPoint != null or earnedPoint != null or currentPoint != null}">
					<div class="summary-row" th:if="${orderId != null}">
						<strong>注文番号</strong>
						<span th:text="${orderId}">1</span>
					</div>
					<div class="summary-row total-row" th:if="${totalAmount != null}">
						<strong>支払金額</strong>
						<span th:text="${#numbers.formatInteger(totalAmount, 0, 'COMMA')} + ' 円'">0 円</span>
					</div>
					<div class="summary-row" th:if="${usedPoint != null}">
						<strong>使用ポイント</strong>
						<span th:text="${#numbers.formatInteger(usedPoint, 0, 'COMMA')} + ' pt'">0 pt</span>
					</div>
					<div class="summary-row" th:if="${earnedPoint != null}">
						<strong>獲得ポイント</strong>
						<span th:text="${#numbers.formatInteger(earnedPoint, 0, 'COMMA')} + ' pt'">0 pt</span>
					</div>
					<div class="summary-row" th:if="${currentPoint != null}">
						<strong>現在の保有ポイント</strong>
						<span th:text="${#numbers.formatInteger(currentPoint, 0, 'COMMA')} + ' pt'">0 pt</span>
					</div>
				</div>

				<div class="complete-buttons">
					<a th:href="@{/order/history}" class="btn btn-primary">注文履歴を見る</a>
					<a th:href="@{/top}" class="btn">トップへ戻る</a>
				</div>
			</div>
		</section>
	</main>

	<div th:replace="~{fragments/ai-widget :: aiWidget}"></div>
</body>

</html>
