<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" th:href="@{/css/productdetil.css}">
  <title>商品詳細 - 北海道EC</title>


</head>

<body>
  <div class="container" id="product-page">

    <header th:replace="fragments/_header :: header"></header>

    <main>

      <div class="product-container">

        <!-- 左：商品画像 -->
        <div class="image-wrap">
          <img
            id="productImage"
            th:src="${product.imageUrl != null} ? @{${product.imageUrl}} : @{/images/placeholder.png}"
            th:alt="${product.productName}"
          />
        </div>

        <!-- 右：商品情報 -->
        <div class="product-info">
          <h1 class="title">[[${product.productName}]]</h1>

          <div class="meta">
            <strong>産地</strong>：[[${region.regionName}]]
            ｜ 
            <strong>カテゴリ</strong>：[[${category.categoryName}]]
          </div>

          <p class="desc">[[${product.description}]]</p>

          <div class="price-stock">
            <div class="price">¥[[${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}]]円</div>
            <div class="stock">在庫：[[${product.stock}]]</div>
          </div>

          <div class="purchase">
            <div class="qty">
              <button type="button" id="decreaseBtn">−</button>
              <input type="number" id="qtyInput" value="1" min="1" />
              <button type="button" id="increaseBtn">＋</button>
            </div>

            <button class="add-cart-btn">カートに追加</button>
          </div>

          <p class="note">※ 配送・支払いはカートで選択してください。</p>

          <div class="ai-box">
            <h3>AIコンシェルジュ</h3>
            <p>おすすめ情報を読み込み中...</p>
          </div>
        </div>
      </div>

      <!-- 下：レビュー欄 -->
      <div class="review-section">
        <h2>レビュー欄</h2>
        <p>レビューを読み込み中...</p>
      </div>

    </main>

  </div>

  <!-- JS（Thymeleaf用インライン） -->
  <script th:inline="javascript">
    (function(){
      const qtyInput   = document.getElementById('qtyInput');
      const decBtn     = document.getElementById('decreaseBtn');
      const incBtn     = document.getElementById('increaseBtn');
      const addCartBtn = document.querySelector('.add-cart-btn');

      // 数量増減ボタン
      decBtn.addEventListener('click', ()=> {
        qtyInput.value = Math.max(1, parseInt(qtyInput.value || 1, 10) - 1);
      });
      incBtn.addEventListener('click', ()=> {
        qtyInput.value = Math.max(1, parseInt(qtyInput.value || 1, 10) + 1);
      });

      // キーボード入力制御（マイナス・e禁止）
      qtyInput.addEventListener('keydown', (e) => {
        if (e.key === "-" || e.key === "e") {
          e.preventDefault();
        }
      });

      // 入力値のバリデーション
      qtyInput.addEventListener('input', ()=> {
        let v = parseInt(qtyInput.value || 1, 10);
        if (isNaN(v) || v < 1) v = 1;
        qtyInput.value = v;
      });

      // カート追加処理（非同期）
      addCartBtn.addEventListener('click', async ()=> {
        const qty = qtyInput.value;
        const productId = /*[[${product.id}]]*/ 0; // Thymeleaf が数値を埋め込む

        const formData = new FormData();
        formData.append("productId", productId);
        formData.append("quantity", qty);

        try {
          const response = await fetch("/order/add", {
            method: "POST",
            body: formData
          });

          if (response.ok) {
            showToast("カートに追加しました！");
            qtyInput.value = 1; // 追加後は1に戻す
          } else {
            showToast("カート追加に失敗しました…", true);
          }

        } catch (error) {
          showToast("通信エラーが発生しました", true);
        }
      });

      // トースト表示（画面上部中央）
      function showToast(message, isError = false) {
        const toast = document.createElement("div");
        toast.textContent = message;
        toast.style.position = "fixed";
        toast.style.top = "20px";
        toast.style.left = "50%";
        toast.style.transform = "translateX(-50%)";
        toast.style.padding = "14px 22px";
        toast.style.borderRadius = "6px";
        toast.style.color = "#fff";
        toast.style.fontSize = "16px";
        toast.style.zIndex = "9999";
        toast.style.background = isError ? "#d9534f" : "#5cb85c";
        toast.style.boxShadow = "0 2px 6px rgba(0,0,0,0.2)";
        toast.style.opacity = "0";
        toast.style.transition = "opacity 0.3s ease";

        document.body.appendChild(toast);

        requestAnimationFrame(() => {
          toast.style.opacity = "1";
        });

        setTimeout(() => {
          toast.style.opacity = "0";
          setTimeout(() => toast.remove(), 500);
        }, 1500);
      }

    })();
  </script>

  <footer th:replace="fragments/_footer :: footer"></footer>

  <!-- cartItems があるときだけ表示 -->
  <a th:if="${session.cartItems != null and #lists.size(session.cartItems) > 0}"
     href="/order/confirm"
     class="floating-checkout-btn">
    注文を確認する
  </a>

</body>
</html>
