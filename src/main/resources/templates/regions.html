  <script th:inline="javascript">
  /*<![CDATA[*/
  const svg = document.getElementById('hokkaidoSvg');
  const tooltip = document.getElementById('tooltip');
  const container = document.getElementById('svgContainer');

  /* 地域ごとのデフォルトソート（下のコードと同じ） */
  const defaultSortByRegion = {
    1: 'id', 2: 'price_desc', 3: 'id', 4: 'id', 5: 'id', 6: 'id', 7: 'id',
    8: 'id', 9: 'id', 10: 'id', 11: 'id', 12: 'id', 13: 'id', 14: 'id'
  };

  /* 下のコードと同じ遷移処理（本質部分） */
  function goToRegion(regionId) {
    const sort = defaultSortByRegion[regionId] || 'id';
    window.location.href = `/products?regionId=${encodeURIComponent(regionId)}&sort=${encodeURIComponent(sort)}`;
  }

  /* カフェボタン版に合わせて .region-btn を対象にする */
  svg.addEventListener('click', (e) => {
    const target = e.target.closest('.region-btn');
    if (!target) return;
    const regionId = parseInt(target.getAttribute('data-region-id'), 10);
    if (!regionId) return;
    goToRegion(regionId);
  });

  /* ツールチップ（必要なら残す） */
  svg.addEventListener('mousemove', (e) => {
    const target = e.target.closest('.region-btn');
    if (!target) {
      hideTooltip();
      return;
    }
    const name = target.getAttribute('data-region-name');
    showTooltip(name, e);
  });

  svg.addEventListener('mouseleave', hideTooltip);

  /* キーボード操作も .region-btn に変更 */
  svg.querySelectorAll('.region-btn').forEach(btn => {
    btn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        const regionId = parseInt(btn.getAttribute('data-region-id'), 10);
        if (regionId) goToRegion(regionId);
      }
    });
  });

  </script>
